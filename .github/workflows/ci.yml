name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff==0.14.0 mypy==1.18.2
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src --ignore-missing-imports --check-untyped-defs
      - run: python -m unittest discover -s tests -v
      - run: engineering-os build repository-health-inspector generated/health
      - run: engineering-os evaluate examples/evaluation/passing.json
      - run: engineering-os compare-evaluations examples/evaluation/passing.json examples/evaluation/passing.json
