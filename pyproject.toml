[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "github-engineering-os"
version = "0.1.0"
description = "Conservative engineering orchestration and repository health analysis"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
engineering-os = "engineering_os.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
